<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World clock</title>
<link rel="stylesheet" href="clock.css">
</head>

<body>
  <div class="clock">
    <div class="info">
      WELCOME TO WORLD
    </div>
  <ul class="times" id="times">
    <li><span id="nyTime"></span></li>
    <li><span id="pakTime"></span></li>
    <li><span id="pacific"></span></li>
    <li><span id="india"></span></li>
    <li><span id="london"></span></li>
    <li><span id="dubai"></span></li>
    <li><span id="tokyo"></span></li>
    <li><span id="sydney"></span></li>
  </ul>
  </div>
  <script src="clock.js"></script>
</body>

</html>
